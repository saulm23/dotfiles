# ~/.config/alacritty/alacritty.toml


[terminal]
shell = "/bin/zsh"
[font]
size = 17
normal = {family = "JetBrainsMonoNerdFont"}

[cursor]
vi_mode_style = {shape="Underline", blinking="On"}

[mouse]
hide_when_typing = true

[colors.primary]
background = "#000000"   # deep graphite
foreground = "#d0d0d0"   # light gray

[colors.cursor]
text = "#111214"
cursor = "#b0b0b0"

[colors.selection]
text = "#111214"
background = "#4a4a4a"

[colors.normal]
black   = "#1a1b1e"
red     = "#5a5a5a"
green   = "#6a6a6a"
yellow  = "#7a7a7a"
blue    = "#8a8a8a"
magenta = "#9a9a9a"
cyan    = "#aaaaaa"
white   = "#cfcfcf"

[colors.bright]
black   = "#2a2b2e"
red     = "#6a6a6a"
green   = "#7a7a7a"
yellow  = "#8a8a8a"
blue    = "#9a9a9a"
magenta = "#aaaaaa"
cyan    = "#bcbcbc"
white   = "#e0e0e0"
