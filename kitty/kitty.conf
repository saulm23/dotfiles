font_size	 19

background #FFFFFF
foreground #000000

# Minimalist Monochrome Tab Styling with Asterisk Indicator
tab_bar_edge        top
tab_bar_align       center
tab_bar_style       separator
tab_separator       " | "

# Title templates to handle the asterisk indicator
active_tab_title_template   "*{index}: {title}"
inactive_tab_title_template " {index}: {title}"

# Seamless colors (No backgrounds, pure text matching your theme)
active_tab_foreground   #000000
active_tab_background   #FFFFFF
active_tab_font_style   bold

inactive_tab_foreground #777777
inactive_tab_background #FFFFFF
inactive_tab_font_style normal

tab_bar_background      #FFFFFF

enable_audio_bell no

font_family      family="JetBrainsMono Nerd Font" style="Bold"
bold_font        auto
italic_font      auto
bold_italic_font auto

