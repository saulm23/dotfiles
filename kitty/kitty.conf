# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
font_size	 15.0
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# graphite
include current-theme.conf
# END_KITTY_THEME
tab_bar_edge top
tab_bar_align center
tab_separator "  |  "
tab_bar_style separator
